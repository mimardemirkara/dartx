<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>DartX · Kamera (deneme)</title>
  <meta name="theme-color" content="#0f1216">
  <link rel="icon" href="icons/favicon-64.png">
  <style>
    :root { --altin: linear-gradient(180deg, #f0cf86 0%, #e3b866 45%, #b98a35 100%); --yazi: #ece7dd; --soluk: #9a948a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #0f1216; color: var(--yazi); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; }
    header a { color: var(--soluk); text-decoration: none; font-size: 22px; padding: 0 6px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
    header h1 b { background: var(--altin); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .rozet { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 3px 8px; border-radius: 99px; color: #1d160a; background: var(--altin); }
    #sahne { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #07090b; }
    #tuval { max-width: 100%; max-height: 100%; touch-action: none; display: block; }
    #bos { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: var(--soluk); }
    #bos svg { width: 64px; height: 64px; opacity: .8; animation: nefes 2.4s ease-in-out infinite; }
    @keyframes nefes { 50% { transform: scale(1.08); opacity: 1; } }
    #yonerge { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 20px); padding: 8px 14px; border-radius: 12px;
      background: rgb(15 18 22 / .82); backdrop-filter: blur(8px); border: 1px solid rgb(255 255 255 / .12); font-size: 14px; text-align: center; pointer-events: none; }
    #yonerge:empty { display: none; }
    #oneri { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 16px;
      background: rgb(15 18 22 / .9); border: 1px solid rgb(240 207 134 / .5); box-shadow: 0 10px 30px -10px rgb(227 184 102 / .5); animation: gir .25s ease-out; }
    #oneri.on { display: flex; }
    #oneri strong { font-size: 26px; min-width: 70px; text-align: center; background: var(--altin); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes gir { from { transform: translate(-50%, 20px); opacity: 0; } }
    footer { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); justify-content: center; }
    button, label.dg { appearance: none; border: 1px solid rgb(255 255 255 / .14); background: rgb(255 255 255 / .06); color: var(--yazi); font: inherit; font-weight: 600;
      padding: 10px 14px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    button.ana { background: var(--altin); color: #1d160a; border-color: transparent; }
    button.onay { background: rgb(47 179 109); border-color: transparent; color: #fff; }
    button:disabled { opacity: .4; }
    button.acik { border-color: rgb(240 207 134 / .7); color: #f3d48f; }
    #kayit { display: flex; gap: 6px; padding: 0 12px; overflow-x: auto; min-height: 30px; align-items: center; }
    #kayit span { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgb(255 255 255 / .08); white-space: nowrap; }
    #kayit span.duz { background: rgb(233 140 60 / .25); }
    #kayit em { color: var(--soluk); font-size: 13px; font-style: normal; }
    input[type=file] { display: none; }
    #oneri.gitti button { display: none; }
    #oneri.gitti::after { content: 'tablete gitti'; font-size: 12px; color: var(--soluk); padding-right: 8px; }
    #qr-perde { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgb(7 9 11 / .9); backdrop-filter: blur(6px); }
    .qr-kart { width: min(420px, 100%); text-align: center; padding: 20px; border-radius: 20px; background: #171b20; border: 1px solid rgb(255 255 255 / .12); }
    .qr-kart h3 { margin: 0 0 12px; }
    .qr-kart p { color: var(--soluk); font-size: 14px; }
    .qr-kod { background: #fff; border-radius: 12px; padding: 10px; }
    .qr-kod svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <a href="./" aria-label="Geri">‹</a>
    <h1><b>DartX</b> Kamera</h1>
    <span class="rozet">DENEME</span>
  </header>
  <div id="sahne">
    <canvas id="tuval" width="16" height="9"></canvas>
    <div id="bos">
      <svg viewBox="0 0 64 64" fill="none" stroke="#e3b866" stroke-width="3" stroke-linejoin="round"><rect x="6" y="16" width="52" height="38" rx="7"/><path d="M22 16l4-7h12l4 7"/><circle cx="32" cy="35" r="11"/><circle cx="32" cy="35" r="4"/></svg>
      <div>Telefonu tahtaya bakacak şekilde sabitle,<br>sonra <b>Kamerayı aç</b>'a dokun.</div>
      <div style="font-size:13px">Kamera yoksa tahtanın bir fotoğrafıyla da deneyebilirsin.</div>
    </div>
    <div id="yonerge"></div>
    <div id="oneri"><strong id="oneri-puan">T20</strong><button class="onay" id="onayla">Onayla</button><button id="duzelt">Düzelt</button></div>
  </div>
  <div id="kayit"><em>Atışlar burada görünür</em></div>
  <footer>
    <button class="ana" id="kamera-ac">Kamerayı aç</button>
    <label class="dg">Fotoğraf seç<input type="file" id="foto" accept="image/*"></label>
    <button id="ayarla" disabled>Tahtayı ayarla</button>
    <button id="izgara" disabled>Izgara</button>
    <button id="algila" disabled>Otomatik algıla</button>
    <button id="tablet" disabled>Tablete bağlan</button>
  </footer>
  <script type="module" src="js/kamera/kamera.js"></script>
</body>
</html>
